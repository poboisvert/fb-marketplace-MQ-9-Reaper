[project]
name = "facebook-marketplace-mcp"
version = "1.0.0"
description = "MCP server for Facebook Marketplace — direct session access"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
    "httpx>=0.27",
    "mcp>=1.9",
]

[project.scripts]
facebook-marketplace = "facebook_marketplace_mcp.cli:main"
facebook-marketplace-mcp = "facebook_marketplace_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
